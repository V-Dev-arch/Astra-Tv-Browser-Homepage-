<!DOCTYPE html>
<html lang="en">
<head> 
  <link rel="icon" type="image/jpeg" href="https://files.catbox.moe/musa64.jpg">
  <meta name="google-site-verification" content="eFSHsqjQ4sTzbKaWFenSl2_jcV535192T5CoYSbnAzg" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astra TV Browser Homepage</title>

<style>
  /* PREMIUM REMOTE TOGGLE */
#remoteToggle{
  position:fixed;
  top:14px;
  right:14px;
  z-index:100000;

  display:flex;
  align-items:center;
  gap:10px;

  padding:12px 18px;
  border-radius:18px;

  background:linear-gradient(135deg,#00d2ff,#3a47d5);
  color:white;

  font-size:15px;
  font-weight:bold;
  letter-spacing:0.5px;

  cursor:pointer;
  user-select:none;

  border:1px solid rgba(255,255,255,0.18);

  box-shadow:
    0 0 18px rgba(0,210,255,0.45),
    inset 0 0 10px rgba(255,255,255,0.12);

  backdrop-filter:blur(10px);

  transition:
    transform .18s,
    box-shadow .18s,
    background .25s;
}

#remoteToggle:hover{
  transform:scale(1.04);
}

#remoteToggle:active{
  transform:scale(0.97);
}

#remoteToggle::before{
  content:"📡";
  font-size:18px;
}

#remoteToggle.off{
  background:linear-gradient(135deg,#2d2d2d,#555);
  box-shadow:
    0 0 10px rgba(255,255,255,0.08),
    inset 0 0 6px rgba(255,255,255,0.05);
}

#remoteToggle.off::before{
  content:"⭕";
}
body{
  margin:0;
  font-family:Arial;
  background:radial-gradient(circle at top,#0b1020,#05070f);
  color:white;
  overflow:hidden;
}

#searchWrap{
  display:flex;
  gap:10px;
  padding:10px;
  align-items:center;
  flex-wrap:wrap;
}

.searchBox{
  display:flex;
  gap:6px;
  flex:1;
}

input{
  padding:10px;
  border-radius:10px;
  border:none;
  outline:none;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  background:#4b7bff;
  color:white;
  cursor:pointer;
}

#categories{
  display:flex;
  gap:10px;
  padding:10px;
  overflow-x:auto;
}

.category{
  position:relative;
  padding:8px 30px 8px 12px;
  border-radius:20px;
  background:rgba(255,255,255,0.1);
  white-space:nowrap;
  cursor:pointer;
}

.category.active{
  background:#4b7bff;
}

#grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:15px;
  padding:20px;
}

.tile{
  position:relative;
  background:rgba(255,255,255,0.08);
  padding:20px;
  border-radius:15px;
  text-align:center;
  cursor:pointer;
}

.add{
  border:2px dashed rgba(255,255,255,0.3);
}

.menuDots,.catDots{
  position:absolute;
  top:6px;
  right:8px;
  font-size:22px;
  cursor:pointer;
}

#contextMenuOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.55);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#contextMenu{
  width:260px;
  background:#121212;
  border-radius:12px;
  overflow:hidden;
}

.menuHeader{
  padding:14px;
  color:#aaa;
}

.menuItem{
  padding:12px;
  cursor:pointer;
}

.menuDanger{
  color:red;
}

.remote-focus{
  outline:3px solid #4b7bff !important;
  box-shadow:0 0 20px rgba(75,123,255,0.7);
  transform:scale(1.05);
}
  #topBar{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  padding:10px;
  flex-wrap:wrap;
}

#voiceBtn{
  width:52px;
  height:52px;
  border-radius:50%;
  border:none;
  cursor:pointer;

  background:linear-gradient(145deg,#3b82ff,#6d5cff);

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;
  overflow:hidden;

  box-shadow:
    0 0 18px rgba(75,123,255,.7),
    inset 0 0 10px rgba(255,255,255,.15);

  transition:0.2s;
}

#voiceBtn:hover{
  transform:scale(1.08);
}

#voiceBtn.listening{
  animation:micPulse 1s infinite;
}

.micGlow{
  position:relative;
  width:20px;
  height:26px;
}

.micBody{
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:12px;
  height:18px;
  border:2px solid white;
  border-radius:10px;
}

.micStem{
  position:absolute;
  bottom:4px;
  left:50%;
  transform:translateX(-50%);
  width:2px;
  height:8px;
  background:white;
}

.micBase{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:14px;
  height:6px;
  border:2px solid white;
  border-top:none;
  border-radius:0 0 10px 10px;
}

.pulseRing{
  position:absolute;
  inset:-10px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.4);
  animation:ringPulse 2s infinite;
}

@keyframes ringPulse{
  0%{
    transform:scale(.7);
    opacity:1;
  }

  100%{
    transform:scale(1.5);
    opacity:0;
  }
}

@keyframes micPulse{
  0%{
    box-shadow:
      0 0 10px rgba(75,123,255,.6),
      0 0 20px rgba(75,123,255,.5);
  }

  50%{
    box-shadow:
      0 0 20px rgba(0,255,255,.9),
      0 0 35px rgba(0,255,255,.7);
  }

  100%{
    box-shadow:
      0 0 10px rgba(75,123,255,.6),
      0 0 20px rgba(75,123,255,.5);
  }
}

  /* WEATHER WIDGET */
#weatherWidget{
  position:fixed;
  bottom:18px;
  left:18px;

  min-width:220px;
  max-width:260px;

  padding:14px 16px;
  border-radius:18px;

  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(14px);

  border:1px solid rgba(255,255,255,0.12);

  box-shadow:
    0 0 18px rgba(0,0,0,0.28),
    inset 0 0 8px rgba(255,255,255,0.05);

  z-index:99999;

  display:flex;
  align-items:center;
  gap:14px;

  transition:0.25s;
}

#weatherWidget:hover{
  transform:scale(1.03);
}

.weatherIconWrap{
  width:52px;
  height:52px;
  border-radius:50%;

  background:linear-gradient(145deg,#3b82ff,#6d5cff);

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;

  box-shadow:
    0 0 16px rgba(75,123,255,.55),
    inset 0 0 8px rgba(255,255,255,.12);
}

.weatherPulse{
  position:absolute;
  inset:-6px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.25);

  animation:weatherPulse 2s infinite;
}

.weatherCloud{
  position:relative;
  width:24px;
  height:12px;

  background:white;
  border-radius:20px;
}

.weatherCloud::before{
  content:"";

  position:absolute;
  top:-7px;
  left:2px;

  width:11px;
  height:11px;

  background:white;
  border-radius:50%;
}

.weatherCloud::after{
  content:"";

  position:absolute;
  top:-10px;
  right:1px;

  width:14px;
  height:14px;

  background:white;
  border-radius:50%;
}

.weatherInfo{
  display:flex;
  flex-direction:column;
  justify-content:center;
}

#weatherTemp{
  font-size:22px;
  font-weight:bold;
  color:white;
}

#weatherCity{
  font-size:14px;
  color:#cfcfcf;
  margin-top:2px;
}

#weatherDesc{
  font-size:13px;
  color:#9fd3ff;
  margin-top:3px;
}

@keyframes weatherPulse{
  0%{
    transform:scale(.8);
    opacity:1;
  }

  100%{
    transform:scale(1.45);
    opacity:0;
  }
}

  #wallpaperBar{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);

  display:flex;
  gap:10px;
  align-items:center;

  padding:12px 14px;

  border-radius:16px;

  background:rgba(255,255,255,0.08);

  backdrop-filter:blur(12px);

  border:1px solid rgba(255,255,255,0.15);

  box-shadow:0 0 15px rgba(0,0,0,0.35);

  z-index:99999;
}

#wallpaperInput{
  width:240px;

  padding:10px 12px;

  border:none;

  border-radius:10px;

  outline:none;

  background:rgba(255,255,255,0.12);

  color:white;
}

#wallpaperBar button{
  padding:10px 14px;

  border:none;

  border-radius:10px;

  background:#4b7bff;

  color:white;

  cursor:pointer;
}

  #menuBtn{
  position:fixed;
  bottom:18px;

  left:calc(50% + 290px);

  width:56px;
  height:56px;

  border-radius:16px;

  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);

  border:1px solid rgba(255,255,255,0.15);

  display:flex;
  align-items:center;
  justify-content:center;

  color:white;
  font-size:28px;

  cursor:pointer;

  z-index:99999;

  box-shadow:0 0 15px rgba(0,0,0,.35);
}

#menuBtn:hover{
  transform:scale(1.05);
}

  #settingsPanel{
  position:fixed;

  bottom:85px;
  right:20px;

  width:250px;

  background:#121212;

  border-radius:16px;

  padding:15px;

  display:none;

  z-index:100000;

  box-shadow:0 0 20px rgba(0,0,0,.5);
}

.settingRow{
  margin:12px 0;
  color:white;
}
  
</style>
</head>

<body>
  <div id="remoteToggle">
  <span id="remoteToggleText">Remote Nav On</span>
  </div>

<div id="topBar">

  <div class="searchBox">
    <input id="searchBar" placeholder="Search Google...">
    <button onclick="search()">Search</button>
  </div>

  <button id="voiceBtn"></button>

  <div class="searchBox">
    <input id="urlBar" placeholder="Enter URL">
    <button onclick="goURL()">Go</button>
  </div>

</div>
<div id="categories"></div>
<div id="grid"></div>

<div id="contextMenuOverlay" onclick="closeMenu()">
  <div id="contextMenu" onclick="event.stopPropagation()">
    <div class="menuHeader" id="menuTitle">Options</div>
    <div id="menuBody"></div>
  </div>
</div>
<script>
let data=JSON.parse(localStorage.getItem("astra"))||{
  categories:[
    {name:"Entertainment",icon:"🎬",tiles:[
      {name:"YouTube",url:"https://youtube.com"},
      {name:"Netflix",url:"https://netflix.com"}
    ]},
    {name:"Social",icon:"📱",tiles:[
      {name:"Facebook",url:"https://facebook.com"}
    ]}
  ]
};

let catIndex=0;
let menuIndex=null;
let menuType=null;
let menuFocusIndex=0;

let introActive=false;
let popupActive=false;

let introDone=localStorage.getItem("astra_intro_done")==="1";
let homeDone=localStorage.getItem("astra_home_done")==="1";
let visitCount=parseInt(localStorage.getItem("astra_visit_count")||"0");

/* ICON */
function icon(url){
  try{
    return "https://www.google.com/s2/favicons?sz=64&domain="+new URL(url).hostname;
  }catch(e){ return ""; }
}
/* VOICE SEARCH */
const voiceBtn=document.getElementById("voiceBtn");
voiceBtn.innerHTML = `
  <div class="micGlow">
    <div class="micBody"></div>
    <div class="micStem"></div>
    <div class="micBase"></div>
    <div class="pulseRing"></div>
  </div>
`;

voiceBtn.onclick=function(){

  const SpeechRecognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert("Voice search not supported");

    return;
  }

  const recognition=new SpeechRecognition();

  recognition.lang="en-US";

  recognition.start();

  voiceBtn.classList.add("listening");

  recognition.onresult=function(event){

    let text=event.results[0][0].transcript;

    searchBar.value=text;

    window.location.href=
      "https://google.com/search?q="+
      encodeURIComponent(text);
  };

  recognition.onend=function(){

    voiceBtn.classList.remove("listening");
  };

  recognition.onerror=function(){

    voiceBtn.innerText="🎤";

    alert("Voice search failed");
  };
};
/* SEARCH */
function search(){
  let q=searchBar.value;
  if(q) window.location.href="https://google.com/search?q="+encodeURIComponent(q);
}

function goURL(){
  let url=urlBar.value;
  if(!url)return;
  if(!url.startsWith("http")) url="https://"+url;
  window.location.href=url;
}

/* INPUT FIX */
function handleInputDone(inputElement){
  inputElement.addEventListener("keydown",function(e){
    if(e.key==="Enter"){
      setTimeout(()=>{
        inputElement.blur();
        document.body.focus();
        updateFocusableElements();
      },200);
    }
  });

  inputElement.addEventListener("blur",function(){
    setTimeout(()=>{
      document.body.focus();
      updateFocusableElements();
    },200);
  });
}

handleInputDone(searchBar);
handleInputDone(urlBar);

/* INTRO SCREEN */
function showIntro(){
  if(introDone) return;

  introActive=true;

  let box=document.createElement("div");
  box.id="astraIntro";

  box.style.cssText=`
    position:fixed;inset:0;z-index:99999;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#070707,#111,#151515);
    color:white;font-family:Arial;
  `;

  box.innerHTML=`
  <div style="
    width:88%;max-width:950px;padding:35px;
    border-radius:28px;
    background:rgba(255,255,255,.05);
    box-shadow:0 0 28px rgba(0,255,255,.18),0 0 35px rgba(255,0,255,.12);
    position:relative;
  ">
    <div style="
      font-size:34px;font-weight:bold;margin-bottom:20px;
      background:linear-gradient(90deg,#00ffff,#ff00ff,#00ff88);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    ">
      Welcome to Astra TV Browser Homepage
    </div>

    <div style="font-size:22px;line-height:1.9;color:#ddd;">
      ~ Full remote, keyboard and game controller support<br>
      ~ Works with browser mouse also<br>
      ~ Modern UI, with eye comfortable colors<br>
      ~ Automatically fetchs logos from the respective website
    </div>

    <div style="
      position:absolute;right:25px;top:50%;
      transform:translateY(-50%);
      text-align:center;
    ">
      <div id="introNext" style="
        width:72px;height:72px;border-radius:50%;
        background:#000;color:#fff;
        display:flex;align-items:center;justify-content:center;
        font-size:42px;cursor:pointer;
        margin:auto;
      ">➜</div>

      <div style="
        margin-top:10px;
        font-size:14px;
        color:#ddd;
        line-height:1.4;
      ">
        Press D-Pad Right<br>or Click Here
      </div>
    </div>
  </div>
  `;

  document.body.appendChild(box);
  document.getElementById("introNext").onclick=closeIntro;
}

function closeIntro(){
  let el=document.getElementById("astraIntro");
  if(el) el.remove();

  introActive=false;
  introDone=true;
  localStorage.setItem("astra_intro_done","1");

  showHomepagePopup();
  updateFocusableElements();
}

/* HOMEPAGE POPUP */
function showHomepagePopup(){
  if(homeDone) return;
  if(visitCount>=3) return;

  popupActive=true;
  visitCount++;
  localStorage.setItem("astra_visit_count",visitCount);

  let pop=document.createElement("div");
  pop.id="astraPopup";

  pop.style.cssText=`
    position:fixed;
    top:25px;right:25px;
    z-index:99998;
    min-width:360px;
    padding:20px;
    border-radius:18px;
    background:#111;
    color:#fff;
    font-family:Arial;
    box-shadow:0 0 20px rgba(0,255,255,.18);
  `;

  pop.innerHTML=`
    <div style="font-size:22px;font-weight:bold;margin-bottom:10px;">
      Make Astra Homepage
    </div>

    <div style="font-size:18px;color:#ccc;line-height:1.5;">
      Set Astra TV Browser as your default homepage.
    </div>

    <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;">
      <div id="popupSetNow" style="
        padding:10px 18px;
        background:#00ffff;
        color:#000;
        border-radius:12px;
        font-weight:bold;
        cursor:pointer;
      ">Set Now</div>

      <div id="popupSet" style="
        padding:10px 18px;
        background:#fff;
        color:#000;
        border-radius:12px;
        font-weight:bold;
        cursor:pointer;
      ">Already Set</div>
    </div>
  `;

  document.body.appendChild(pop);

  document.getElementById("popupSetNow").onclick=function(){
    alert("Open browser menu and set this page as homepage / start page.");
  };

  document.getElementById("popupSet").onclick=function(){
    localStorage.setItem("astra_home_done","1");
    homeDone=true;
    closePopup();
  };

  setTimeout(closePopup,5000);
}

function closePopup(){
  let p=document.getElementById("astraPopup");
  if(p) p.remove();
  popupActive=false;
  updateFocusableElements();
}

/* MENU */
function openMenu(type,index,name){
  menuType=type;
  menuIndex=index;
  menuTitle.innerText=name;
  menuFocusIndex=0;

  if(type==="tile"){
    menuBody.innerHTML=`
      <div class="menuItem" onclick="editTile()">Edit</div>
      <div class="menuItem menuDanger" onclick="deleteTile()">Delete</div>
    `;
  }

  if(type==="category"){
    menuBody.innerHTML=`
      <div class="menuItem" onclick="editCategory()">Edit</div>
      <div class="menuItem menuDanger" onclick="deleteCategory()">Delete</div>
    `;
  }

  contextMenuOverlay.style.display="flex";
  updateMenuFocus();
}

function updateMenuFocus(){
  let items=document.querySelectorAll(".menuItem");
  items.forEach(item=>item.classList.remove("remote-focus"));
  if(items[menuFocusIndex]) items[menuFocusIndex].classList.add("remote-focus");
}

function closeMenu(){
  contextMenuOverlay.style.display="none";
  updateFocusableElements();
}

function editTile(){
  let t=data.categories[catIndex].tiles[menuIndex];
  let name=prompt("Name",t.name);
  let url=prompt("URL",t.url);

  if(name&&url){
    t.name=name;
    t.url=url;
    save();
    render();
  }
  closeMenu();
}

function deleteTile(){
  data.categories[catIndex].tiles.splice(menuIndex,1);
  save();
  render();
  closeMenu();
}

function editCategory(){
  let c=data.categories[menuIndex];
  let name=prompt("Category name",c.name);

  if(name){
    c.name=name;
    save();
    render();
  }
  closeMenu();
}

function deleteCategory(){
  data.categories.splice(menuIndex,1);
  catIndex=0;
  save();
  render();
  closeMenu();
}

function save(){
  localStorage.setItem("astra",JSON.stringify(data));
}

/* CATEGORIES */
function renderCategories(){
  categories.innerHTML="";

  data.categories.forEach((cat,i)=>{
    let el=document.createElement("div");
    el.className="category"+(i===catIndex?" active":"");

    el.innerHTML=`
      ${(cat.icon||"📁")} ${cat.name}
      <div class="catDots">⋮</div>
    `;

    el.onclick=()=>{ catIndex=i; render(); };

    el.querySelector(".catDots").onclick=(e)=>{
      e.stopPropagation();
      openMenu("category",i,"Category Options");
    };

    categories.appendChild(el);
  });

  let add=document.createElement("div");
  add.className="category";
  add.innerText="+ Category";

  add.onclick=()=>{
    let name=prompt("Category name");
    if(name){
      data.categories.push({name,icon:"📁",tiles:[]});
      save();
      render();
    }
  };

  categories.appendChild(add);
}

/* TILES */
function renderTiles(){
  grid.innerHTML="";
  let tiles=data.categories[catIndex].tiles;

  tiles.forEach((t,i)=>{
    let el=document.createElement("div");
    el.className="tile";

    el.innerHTML=`
      <img src="${icon(t.url)}" width="32">
      <div>${t.name}</div>
      <div class="menuDots">⋮</div>
    `;

    el.onclick=()=>window.open(t.url,"_blank");

    el.querySelector(".menuDots").onclick=(e)=>{
      e.stopPropagation();
      openMenu("tile",i,"Tile Options");
    };

    grid.appendChild(el);
  });

  let add=document.createElement("div");
  add.className="tile add";
  add.innerText="+ Add";

  add.onclick=()=>{
    let name=prompt("Name");
    let url=prompt("URL");

    if(name&&url){
      data.categories[catIndex].tiles.push({name,url});
      save();
      render();
    }
  };

  grid.appendChild(add);
}

/* REMOTE */
let remoteNavEnabled=true;

const remoteToggle=document.getElementById("remoteToggle");
const remoteToggleText=document.getElementById("remoteToggleText");

remoteToggle.onclick=function(){

  remoteNavEnabled=!remoteNavEnabled;

  if(remoteNavEnabled){

    remoteToggleText.innerText="Remote Nav On";
    remoteToggle.classList.remove("off");

    updateFocusableElements();

  }else{

    remoteToggleText.innerText="Remote Nav Off";
    remoteToggle.classList.add("off");

    clearFocus();
  }
};

let currentSection="search";
let searchIndex=0;
let categoryFocusIndex=0;
let tileFocusIndex=0;
let categoryDotMode=false;
let tileDotMode=false;

function clearFocus(){
  document.querySelectorAll(".remote-focus").forEach(el=>{
    el.classList.remove("remote-focus");
  });
}

function updateFocusableElements(){
  if(introActive) return;

  if(contextMenuOverlay.style.display==="flex"){
    updateMenuFocus();
    return;
  }

  clearFocus();

  const searchElements=[
    searchBar,
    document.querySelectorAll("#searchWrap button")[0],
    urlBar,
    document.querySelectorAll("#searchWrap button")[1]
  ];

  const categoryElements=document.querySelectorAll(".category");
  const categoryDots=document.querySelectorAll(".catDots");
  const tileElements=document.querySelectorAll(".tile");
  const tileDots=document.querySelectorAll(".menuDots");

  let target=null;

  if(currentSection==="search") target=searchElements[searchIndex];
  else if(currentSection==="categories"){
    target=categoryDotMode ? categoryDots[categoryFocusIndex] : categoryElements[categoryFocusIndex];
  }else if(currentSection==="tiles"){
    target=tileDotMode ? tileDots[tileFocusIndex] : tileElements[tileFocusIndex];
  }

  if(target){
    target.classList.add("remote-focus");
    target.scrollIntoView({behavior:"smooth",block:"nearest",inline:"nearest"});
  }
}

  document.addEventListener("keydown",function(e){

  if(!remoteNavEnabled) return;

  if(introActive){
    if(e.key==="ArrowRight" || e.key==="Enter") closeIntro();
    return;
  }

  if(popupActive){
    if(e.key==="Escape"||e.key==="Backspace"||e.key==="Enter") closePopup();
  }

  const categoryElements=document.querySelectorAll(".category");
  const tileElements=document.querySelectorAll(".tile");

  if(contextMenuOverlay.style.display==="flex"){
    let items=document.querySelectorAll(".menuItem");

    if(e.key==="ArrowDown" && menuFocusIndex<items.length-1) menuFocusIndex++;
    else if(e.key==="ArrowUp" && menuFocusIndex>0) menuFocusIndex--;
    else if(e.key==="Enter") items[menuFocusIndex]?.click();
    else if(e.key==="Escape"||e.key==="Backspace") closeMenu();

    updateMenuFocus();
    return;
  }

  if(e.key==="Escape"||e.key==="Backspace"){
    closeMenu();
    return;
  }

  if(currentSection==="search"){
    if(e.key==="ArrowRight" && searchIndex<3) searchIndex++;
    else if(e.key==="ArrowLeft" && searchIndex>0) searchIndex--;
    else if(e.key==="ArrowDown") currentSection="categories";
  }

  else if(currentSection==="categories"){
    if(e.key==="ArrowRight"){
      if(!categoryDotMode) categoryDotMode=true;
      else{
        categoryDotMode=false;
        if(categoryFocusIndex<categoryElements.length-1) categoryFocusIndex++;
      }
    }
    else if(e.key==="ArrowLeft"){
      if(categoryDotMode) categoryDotMode=false;
      else if(categoryFocusIndex>0) categoryFocusIndex--;
    }
    else if(e.key==="ArrowDown") currentSection="tiles";
    else if(e.key==="ArrowUp") currentSection="search";
  }

  else if(currentSection==="tiles"){
    const columns=5;

    if(e.key==="ArrowRight"){
      if(!tileDotMode) tileDotMode=true;
      else{
        tileDotMode=false;
        if(tileFocusIndex<tileElements.length-1) tileFocusIndex++;
      }
    }
    else if(e.key==="ArrowLeft"){
      if(tileDotMode) tileDotMode=false;
      else if(tileFocusIndex>0) tileFocusIndex--;
    }
    else if(e.key==="ArrowDown"){
      if(tileFocusIndex+columns<tileElements.length) tileFocusIndex+=columns;
    }
    else if(e.key==="ArrowUp"){
      if(tileFocusIndex-columns>=0) tileFocusIndex-=columns;
      else currentSection="categories";
    }
  }

  if(e.key==="Enter"){
    let focused=document.querySelector(".remote-focus");
    if(focused){
      if(focused.tagName==="INPUT") focused.focus();
      else focused.click();
    }
  }

  updateFocusableElements();
});

function render(){
  renderCategories();
  renderTiles();
  updateFocusableElements();
}

  /* WEATHER */
async function loadWeather(lat,lon){

  try{

    const res=await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`
    );

    const data=await res.json();

    const temp=data.current_weather.temperature;
    const code=data.current_weather.weathercode;

    let desc="Clear";

    if(code>=1 && code<=3) desc="Cloudy";
    if(code>=45) desc="Fog";
    if(code>=51) desc="Drizzle";
    if(code>=61) desc="Rain";
    if(code>=71) desc="Snow";
    if(code>=95) desc="Storm";

    document.getElementById("weatherTemp").innerText=
      temp + "°C";

    document.getElementById("weatherDesc").innerText=
      desc;

  }catch(err){

    document.getElementById("weatherTemp").innerText=
      "--";

    document.getElementById("weatherDesc").innerText=
      "Weather unavailable";
  }
}

function startWeather(){

  if(!navigator.geolocation){

    document.getElementById("weatherCity").innerText=
      "Location unsupported";

    return;
  }

  navigator.geolocation.getCurrentPosition(

    async(position)=>{

      const lat=position.coords.latitude;
      const lon=position.coords.longitude;

      document.getElementById("weatherCity").innerText=
        "Your Location";

      loadWeather(lat,lon);
    },

    ()=>{

      document.getElementById("weatherCity").innerText=
        "Location denied";

      document.getElementById("weatherTemp").innerText=
        "--";
    }

  );
}

startWeather();

render();

setTimeout(function(){
  if(!introDone) showIntro();
  else showHomepagePopup();
},700);

function setWallpaper(){

  let url=document
    .getElementById("wallpaperInput")
    .value
    .trim();

  if(!url) return;

  document.body.style.background=
    `url('${url}') center/cover no-repeat fixed`;

  localStorage.setItem(
    "astra_wallpaper",
    url
  );
}

function resetWallpaper(){

  localStorage.removeItem(
    "astra_wallpaper"
  );

  document.body.style.background=
    "radial-gradient(circle at top,#0b1020,#05070f)";
}

  );

  document.body.style.background=
    `url('${savedWallpaper}') center/cover no-repeat fixed`;
}
